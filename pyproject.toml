[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truthledger"
version = "0.1.0"
description = "TruthLedger — governance for an AI agent's truth store: whitelist firewall, provenance audit, multi-source immortality guard, 4-phase governance loop."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ZONGYUAN-ROOT contributors" }]
keywords = ["ai-safety", "agent", "memory", "provenance", "audit", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["truthledger"]
